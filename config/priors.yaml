# Conservative success priors used only by I7 (the stopping rule).
#
# These are deliberately pessimistic and deliberately committed to the repo: a
# stopping rule tuned in secret is not a stopping rule, it is a knob. A model's
# stated confidence can attenuate these numbers but can never raise them above
# the value written here.
#
